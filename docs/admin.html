<title>מנהל עיר</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Secular+One&family=Noto+Sans+Hebrew:wght@400;500;700;800&display=swap">
<style>
/* City admin prototype, v2. DESIGN.md: graphite sign plates, sign-blue action only, wait scale green/amber/red, Secular One for numbers/headings, big targets, no sideways scroll, light-only. Works on a phone: tabs become an icon grid, tables become cards. */
:root {
  --page: #e7e9ec; --page-muted: #555c66; --page-line: #cdd1d7;
  --bg: #f1f2f4; --surface: #ffffff; --ink: #121519; --muted: #5b626c; --line: #dadde2; --line2: #b8bdc5;
  --plate: #1a1e24; --plate2: #2a3039; --action: #0b4c9e; --action-soft: #e6eefa;
  --ok: #1f7a3a; --ok-soft: #e3f1e7; --warn: #a15f00; --warn-soft: #fdefd2; --bad: #c92a2a; --bad-soft: #fbe5e5;
  --display: "Secular One", "Noto Sans Hebrew", Arial, sans-serif;
  --body: "Noto Sans Hebrew", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--ink); font-family: var(--body); direction: rtl; font-size: 15.5px; line-height: 1.5; }
.page { max-width: 1400px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 56px; }
@media (max-width: 600px) { .page { padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-block: 12px 40px; } }
.intro { max-width: 90ch; display: grid; gap: 6px; margin-bottom: 18px; }
.intro h1 { font-family: var(--display); font-weight: 400; font-size: clamp(24px, 4vw, 32px); margin: 0; }
.intro p { margin: 0; color: var(--page-muted); }
.frame { border: 1px solid var(--page-line); border-radius: 6px; background: var(--bg); overflow: clip; }

svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.m-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; background: var(--plate); color: #fff; padding: 8px 16px; min-height: 56px; border-bottom: 4px solid #fff; box-shadow: 0 4px 0 var(--plate); }
.brand { font-family: var(--display); font-size: 22px; white-space: nowrap; }
.brand span { font-family: var(--body); font-size: 13px; opacity: .75; margin-inline-start: 8px; }
.top-note { margin-inline-start: auto; font-size: 13.5px; opacity: .9; display: flex; align-items: center; gap: 6px; }

.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 14px; padding: 16px 12px 14px; align-items: start; }
.tabs { display: grid; gap: 6px; position: sticky; top: 12px; }
.tabs a { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 14px; border-radius: 8px; border: 2px solid var(--line2); background: #fff; color: var(--ink); text-decoration: none; font-weight: 700; }
.tabs a:hover { border-color: var(--action); color: var(--action); }
.tabs a.on { background: var(--plate); color: #fff; border-color: var(--plate); }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); padding: 10px 8px; }
  .tabs { position: static; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
  .tabs a { flex-direction: column; justify-content: center; gap: 2px; min-height: 60px; padding: 6px 4px; font-size: 13px; text-align: center; }
}
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, label.filebtn:focus-within { outline: 3px solid var(--action); outline-offset: 2px; }

.panel { background: var(--surface); border: 2px solid var(--line2); border-radius: 8px; min-width: 0; }
.p-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; background: #e9ebee; border-bottom: 2px solid var(--line2); border-radius: 6px 6px 0 0; }
.p-h h2 { font-family: var(--display); font-weight: 400; font-size: 20px; margin: 0; display: flex; align-items: center; gap: 8px; }
.p-h .tools { margin-inline-start: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
@media (max-width: 600px) { .p-h .tools { margin-inline-start: 0; width: 100%; } .p-h { padding: 10px 12px; } }
.p-b { padding: 14px 16px; display: grid; gap: 16px; }
@media (max-width: 600px) { .p-b { padding: 12px; } }
.muted { color: var(--muted); }
.lead { margin: 0; color: var(--muted); }
.section-t { font-family: var(--display); font-weight: 400; font-size: 17px; margin: 0; display: flex; align-items: center; gap: 8px; }

.b1, .b2, .b3 { display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; white-space: nowrap; border-radius: 6px; }
.b1 { font-family: var(--display); font-size: 15.5px; border: 0; padding: 0 18px; height: 42px; background: var(--action); color: #fff; }
.b1.danger { background: var(--bad); }
.b2 { font: inherit; font-weight: 700; font-size: 14.5px; background: #fff; border: 2px solid var(--line2); padding: 0 14px; height: 42px; color: var(--ink); }
.b2:hover { border-color: var(--action); color: var(--action); }
.b3 { font: inherit; font-weight: 700; font-size: 13.5px; background: #fff; border: 2px solid var(--line2); padding: 0 12px; height: 38px; color: var(--ink); }
.b3:hover { border-color: var(--action); color: var(--action); }
.b3.danger { color: var(--bad); }
.b3.danger:hover { border-color: var(--bad); }
.b1 svg.i, .b2 svg.i, .b3 svg.i { width: 18px; height: 18px; }
.fbtn { font: inherit; font-size: 13.5px; font-weight: 700; color: var(--ink); background: #fff; border: 2px solid var(--line2); border-radius: 6px; padding: 0 12px; height: 38px; cursor: pointer; }
.fbtn.on { background: var(--plate); color: #fff; border-color: var(--plate); }

input[type=text], input[type=tel], input[type=email], input[type=date], input[type=time], input[type=search], select {
  font: inherit; font-size: 16px; color: var(--ink); background: #fff; border: 2px solid var(--line2); border-radius: 6px; height: 44px; padding: 0 12px; width: 100%;
}
input:focus, select:focus { outline: none; border-color: var(--action); box-shadow: 0 0 0 3px var(--action-soft); }
input.err, select.err { border-color: var(--bad); background: var(--bad-soft); }
input.good, select.good { border-color: var(--ok); }
.f { display: grid; gap: 4px; font-weight: 700; font-size: 13.5px; color: var(--muted); align-content: start; min-width: 0; }
.req { color: var(--bad); font-weight: 800; margin-inline-start: 3px; }
.msg { font-size: 13px; font-weight: 700; min-height: 18px; color: var(--bad); }
.hint { font-weight: 500; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 16px; }
.seg { display: inline-flex; border: 2px solid var(--line2); border-radius: 6px; overflow: hidden; height: 44px; width: max-content; max-width: 100%; }
.seg label { display: flex; align-items: center; padding: 0 16px; cursor: pointer; font-weight: 700; font-size: 15px; color: var(--ink); border-inline-start: 1px solid var(--line2); }
.seg label:first-child { border-inline-start: 0; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--action); color: #fff; }
.seg label:has(input:focus-visible) { outline: 3px solid var(--action); outline-offset: -3px; }
.seg.err { border-color: var(--bad); }
.with-ico { position: relative; }
.with-ico svg.i { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.with-ico input { padding-right: 40px; }

/* Tables: cards on a phone */
table { border-collapse: collapse; width: 100%; table-layout: fixed; }
th, td { text-align: right; padding: 0 10px; }
th { font-weight: 800; font-size: 12.5px; color: var(--muted); height: 34px; border-bottom: 1px solid var(--line2); }
td { height: 46px; border-bottom: 1px solid var(--line); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.wrap { white-space: normal; padding-block: 6px; }
@media (max-width: 760px) {
  table.rt, table.rt tbody, table.rt tr, table.rt td { display: block; width: 100%; }
  table.rt colgroup, table.rt thead { display: none; }
  table.rt tr { border: 2px solid var(--line2); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; display: grid; gap: 4px; }
  table.rt td { height: auto; border: 0; padding: 2px 0; white-space: normal; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  table.rt td[data-l]::before { content: attr(data-l); font-size: 12.5px; font-weight: 800; color: var(--muted); min-width: 92px; }
  table.rt td.act { justify-content: flex-start; }
}
.nm { font-weight: 800; }
.pl { display: inline-flex; justify-content: center; align-items: center; min-width: 34px; height: 24px; padding: 0 7px; font-family: var(--display); font-size: 14px; border-radius: 5px; background: var(--plate); color: #fff; box-shadow: inset 0 0 0 2px var(--plate), inset 0 0 0 3.5px #fff; white-space: nowrap; }
.pl-name { background: #fff; color: var(--plate); box-shadow: inset 0 0 0 2px var(--plate); font-family: var(--body); font-weight: 800; font-size: 12.5px; }
.ico { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 22px; border: 2px solid var(--plate); border-radius: 4px; color: var(--plate); flex: none; vertical-align: middle; }
.ico svg.i { width: 16px; height: 16px; stroke-width: 2.2; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; font-size: 12.5px; border-radius: 5px; padding: 1px 8px; white-space: nowrap; }
.chip.no { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.role { background: var(--action-soft); color: var(--action); }
.nowrap { white-space: nowrap; unicode-bidi: isolate; display: inline-block; }

/* Dashboard */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
@media (max-width: 600px) { .tiles { grid-template-columns: 1fr 1fr; } }
.tile { border: 2px solid var(--line2); border-radius: 8px; padding: 10px 14px; display: grid; gap: 2px; background: #fff; min-width: 0; }
.tile .k { font-size: 14px; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 6px; }
.tile .k svg.i { width: 18px; height: 18px; }
.tile .v { font-family: var(--display); font-size: 32px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.tile .v small { font-family: var(--body); font-size: 14px; color: var(--muted); font-weight: 700; margin-inline-start: 4px; }
.tile.alert { border-color: var(--bad); }
.chart-wrap { position: relative; }
.chart { width: 100%; height: auto; display: block; }
.tip { position: absolute; pointer-events: none; background: var(--plate); color: #fff; border-radius: 6px; padding: 6px 10px; font-size: 13.5px; font-weight: 700; white-space: nowrap; transform: translate(-50%, -110%); display: none; z-index: 2; }
.tip b { font-family: var(--display); font-weight: 400; font-size: 16px; }
details.tbl-view summary { cursor: pointer; font-weight: 700; min-height: 42px; display: flex; align-items: center; gap: 6px; color: var(--action); }
details.tbl-view table td, details.tbl-view table th { height: 34px; }
.tbl-cols { columns: 3 160px; column-gap: 24px; }
.tbl-cols div { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding: 4px 0; break-inside: avoid; }
.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.list li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.list b { font-family: var(--display); font-weight: 400; font-size: 17px; font-variant-numeric: tabular-nums; }

/* List manager (communities, streets): search, add new, the list below */
.lm-bar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px 16px; align-items: start; }
@media (max-width: 700px) { .lm-bar { grid-template-columns: minmax(0, 1fr); } }
.lm-add { display: flex; gap: 8px; align-items: start; }
.lm-add .f { flex: 1; }
.lm-add .b1 { margin-top: 23px; height: 44px; }
.lm-count { font-size: 14px; color: var(--muted); font-weight: 700; }
/* Record list: one row per record, a header row, running number, source, edit and remove */
.lm-list { list-style: none; margin: 0; padding: 0; border: 2px solid var(--line2); border-radius: 8px; overflow: hidden; background: #fff; }
.lm-list li { display: grid; grid-template-columns: 48px minmax(0, 1fr) 130px auto; align-items: center; gap: 10px; min-height: 52px; padding: 4px 10px; border-bottom: 1px solid var(--line); }
.lm-list li:last-child { border-bottom: 0; }
.lm-list li:nth-child(even):not(.lm-head) { background: #fafbfc; }
.lm-list li.lm-head { min-height: 36px; background: #e9ebee; border-bottom: 2px solid var(--line2); font-size: 12.5px; font-weight: 800; color: var(--muted); }
.lm-list li.editing { background: var(--action-soft); }
.lm-list .no { font-family: var(--display); color: var(--muted); font-variant-numeric: tabular-nums; }
.lm-list .t { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lm-list .t mark { background: #fff1b8; color: inherit; border-radius: 2px; }
.lm-list .src { font-size: 13px; color: var(--muted); font-weight: 700; }
.lm-list .src.manual { color: var(--action); }
.lm-list .acts { display: flex; gap: 6px; justify-content: flex-end; }
.lm-list .acts .b3 { height: 38px; }
.lm-list .edit-in { display: grid; gap: 2px; }
.lm-list .edit-in input { height: 40px; }
@media (max-width: 600px) {
  .lm-list li { grid-template-columns: 36px minmax(0, 1fr) auto; }
  .lm-list li .src { grid-column: 2; grid-row: 2; }
  .lm-list li .acts { grid-row: 1 / span 2; grid-column: 3; }
  .lm-list li.lm-head .src { display: none; }
  .lm-list .acts .b3 span { display: none; }
}
.icon-btn { flex: none; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border: 2px solid var(--line2); border-radius: 8px; background: #fff; color: var(--muted); cursor: pointer; }
.icon-btn:hover { color: var(--bad); border-color: var(--bad); }
.lm-empty { padding: 14px; border: 2px dashed var(--line2); border-radius: 8px; color: var(--muted); text-align: center; }

/* Combobox */
.combo { position: relative; }
.combo-list { display: none; position: absolute; top: 100%; right: 0; left: 0; z-index: 15; margin: 4px 0 0; padding: 4px; list-style: none; background: #fff; border: 2px solid var(--action); border-radius: 6px; box-shadow: 0 6px 16px rgba(0,0,0,.12); max-height: 220px; overflow: auto; }
.combo-list.show { display: block; }

.combo-list li.hl, .combo-list li:hover { background: var(--action-soft); }
.combo-list li mark { background: #fff1b8; color: inherit; }
.combo-list .empty { color: var(--muted); cursor: default; }

/* Base */
.status { display: flex; gap: 12px; align-items: center; border: 2px solid var(--line2); border-radius: 8px; padding: 12px 14px; }
.status .s-t { display: grid; gap: 2px; min-width: 0; }
.status svg.i { width: 28px; height: 28px; }
.status.loaded { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.status.loaded .s-t span { color: var(--ink); }
.filebox { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.filebtn { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border: 2px solid var(--plate); border-radius: 6px; background: #fff; color: var(--plate); font-weight: 800; cursor: pointer; }
.filebtn:hover { background: var(--bg); }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.filename { font-weight: 700; color: var(--muted); overflow-wrap: anywhere; }
.filename.has { color: var(--ink); }
.map-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 14px; }
.legal { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 14px; font-weight: 700; }
.cert { border: 2px solid var(--plate); border-radius: 8px; padding: 14px 16px; display: grid; gap: 6px; background: #fff; }
.cert h3 { font-family: var(--display); font-weight: 400; font-size: 18px; margin: 0; }
.cert dl { margin: 0; display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 4px 10px; }
.cert dt { color: var(--muted); font-weight: 700; }
.cert dd { margin: 0; }

/* Dialogs: X, click outside, Esc */
.dlg-back { position: fixed; inset: 0; background: rgba(18,21,25,.45); display: none; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
.dlg-back.show { display: flex; }
@media (max-width: 600px) { .dlg-back { padding: 0; align-items: flex-end; } .dlg { border-radius: 12px 12px 0 0 !important; max-height: 92vh !important; } }
.dlg { width: min(620px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: #fff; border: 3px solid var(--plate); border-radius: 8px; box-shadow: 0 18px 40px rgba(0,0,0,.35); }
.dlg-h { display: flex; align-items: center; gap: 8px; padding: 8px 14px; font-family: var(--display); font-size: 19px; background: #e9ebee; border-bottom: 2px solid var(--line2); position: sticky; top: 0; z-index: 2; }
.xbtn { margin-inline-start: auto; flex: none; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; font: inherit; font-size: 26px; line-height: 1; background: #fff; border: 2px solid var(--line2); border-radius: 8px; cursor: pointer; color: var(--ink); }
.xbtn:hover { border-color: var(--bad); color: var(--bad); }
.dlg-body { padding: 14px 16px; display: grid; gap: 12px; }
.dlg-acts { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
.toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--plate); color: #fff; border: 2px solid #fff; box-shadow: 0 0 0 2px var(--plate), 0 8px 20px rgba(0,0,0,.25); border-radius: 8px; padding: 10px 18px; font-weight: 700; display: none; z-index: 50; max-width: calc(100% - 32px); text-align: center; }
.toast.show { display: block; }
</style>
<style id="green">
/* ירוק (בהשראת Wavespace): לבן ואפור-ירקרק, כרטיסים לבנים מעוגלים שצפים בצל רך, כפתורים גדולים ועגולים, ירוק אחד לפעולה. Rubik לכל הטקסט. מחליף רק מראה, לא תוכן. */
:root {
  --page: #e8ede9; --page-muted: #5f6b63; --page-line: #d6ded8;
  --bg: #f2f5f3; --surface: #ffffff; --ink: #121a14; --muted: #5f6b63; --line: #e6ebe7; --line2: #d3dbd5;
  --plate: #121a14; --plate2: #25302a; --action: #16a34a; --action-soft: #e8f7ee;
  --ok: #1f7a3a; --ok-soft: #e4f3e8; --warn: #a15f00; --warn-soft: #fdf0d8; --bad: #c92a2a; --bad-soft: #fde8e8;
  --soft: #eef2ef; --soft2: #e3e9e5;
  --shadow: 0 8px 30px rgba(15, 30, 20, .08);
  --shadow-pop: 0 18px 48px rgba(15, 30, 20, .22);
  --display: "Rubik", "Noto Sans Hebrew", Arial, sans-serif;
  --body: "Rubik", "Noto Sans Hebrew", Arial, sans-serif;
}
body { background: var(--page); font-family: var(--body); }
.intro h1 { font-weight: 600; }

/* מסגרת ומסך */
.frame { border: 0; border-radius: 24px; background: var(--bg); box-shadow: 0 30px 60px -36px rgba(15, 30, 20, .35); }
.screen { background: var(--bg); border-radius: 24px; }

/* פס עליון: לבן, לא גרפיט */
.m-top, .a-top { background: #fff; color: var(--ink); border-bottom: 0; box-shadow: 0 1px 0 var(--line); }
.m-top { min-height: 66px; padding: 10px 18px; border-radius: 24px 24px 0 0; }
.brand { font-weight: 600; font-size: 20px; color: var(--ink); }
.brand span { opacity: 1; color: var(--muted); font-weight: 400; }
.m-clock { font-weight: 500; color: var(--ink); }
.top-note { color: var(--muted); }
.search input { border: 0; background: var(--soft); border-radius: 999px; height: 44px; padding: 0 18px; color: var(--ink); }
.search input:focus { outline: none; box-shadow: 0 0 0 2px var(--action); background: #fff; }
.m-kpi { background: var(--soft); border: 0; border-radius: 999px; color: var(--ink); padding: 4px 14px; }
.m-kpi.hot { background: var(--bad-soft); color: var(--bad); }
.btn-new { background: var(--action); color: #fff; box-shadow: none; border-radius: 999px; font-weight: 600; padding: 0 20px; height: 44px; }
.results, .combo-list { border: 0; border-radius: 18px; box-shadow: var(--shadow-pop); padding: 6px; }
.res { border-radius: 12px; border-bottom: 0; }
.res:hover, .combo-list li.hl, .combo-list li:hover { background: var(--soft); }

    return '<p class="lead">איזו עמודה בקובץ היא כל שדה? נטענים רק השדות האלה.</p><div class="map-cols">' +
      fields.map(function (f, i) {
        return '<div class="f"><label for="' + f[0] + '">' + f[1] + (f[2] ? '<span class="req">*</span>' : '') + '</label><select id="' + f[0] + '" data-req="' + (f[2] ? 1 : 0) + '"><option value="">בחר עמודה</option>' +
          cols.map(function (c, j) { return '<option' + (j === i ? " selected" : "") + '>' + c + '</option>'; }).join("") + '</select><div class="msg" id="' + f[0] + 'Msg"></div></div>';
      }).join("") + '</div><div><button class="b1" type="button" id="loadBase">' + I("upload") + 'טען את הבייס</button></div>';
  }
  function certHtml(c) {
    return '<div class="cert"><h3>אישור מחיקת בייס מצביעים</h3><dl>' +
      '<dt>עיר</dt><dd>' + esc(CITY.name) + '</dd><dt>בחירות</dt><dd>' + (CITY.type === "knesset" ? "כנסת" : "רשויות מקומיות") + ', ' + hebDate(CITY.date) + '</dd>' +
      '<dt>קובץ</dt><dd>' + esc(c.file) + '</dd><dt>מצביעים</dt><dd>' + c.rows.toLocaleString("he-IL") + '</dd>' +
      '<dt>נמחק</dt><dd>' + c.at + '</dd><dt>על ידי</dt><dd>' + esc(c.by) + '</dd>' +
      '<dt>מה נמחק</dt><dd>כל רשומות הבייס, מהמסד ומכל הגיבויים. פניות שנקלטו בשיחה לא נמחקו.</dd>' +
      '<dt>נשלח אל</dt><dd>' + esc(CITY.privacyEmail) + ', ומנהל העיר</dd></dl></div>';
  }

  // ---------- Users ----------
  V.users = function () {
    return '<div class="p-h"><h2>' + I("users") + 'משתמשים</h2><span class="muted">כניסה באימייל, סיסמה וקוד שנשלח למייל</span><div class="tools"><button class="b1" type="button" id="addUser">' + I("plus") + 'משתמש חדש</button></div></div><div class="p-b">' +
      '<table class="rt"><colgroup><col><col style="width:32%"><col style="width:120px"><col style="width:130px"><col style="width:96px"></colgroup><thead><tr><th>שם</th><th>אימייל</th><th>תפקיד</th><th>כניסה אחרונה</th><th></th></tr></thead><tbody>' +
      USERS.map(function (u, i) { return '<tr><td class="nm" data-l="שם">' + esc(u.name) + '</td><td data-l="אימייל"><span dir="ltr">' + esc(u.email) + '</span></td><td data-l="תפקיד"><span class="chip role">' + u.role + '</span></td><td class="muted" data-l="כניסה אחרונה">' + u.last + '</td><td class="act"><button class="b3 danger" type="button" data-del-user="' + i + '">' + I("trash") + 'הסר</button></td></tr>'; }).join("") +
      '</tbody></table></div>';
  };
  function userDlg() {
    openDlg("משתמש חדש",
      '<div class="f"><label for="uEmail">אימייל<span class="req">*</span></label><input type="email" id="uEmail" dir="ltr" style="text-align:right"><div class="msg" id="uEmailMsg"></div></div>' +
      '<div class="f"><label for="uName">שם<span class="req">*</span></label><input type="text" id="uName"><div class="msg" id="uNameMsg"></div></div>' +
      '<div class="f"><label for="uRole">תפקיד<span class="req">*</span></label><select id="uRole"><option value="">בחר תפקיד</option><option>מוקדן</option><option>משבץ</option><option>מנהל עיר</option></select><div class="msg" id="uRoleMsg"></div></div>' +
      '<p class="lead">המשתמש יקבל מייל עם קישור לקביעת סיסמה.</p>',
      '<button class="b1" type="button" id="uSave">' + I("check") + 'הוסף ושלח הזמנה</button><button class="b2" type="button" id="uCancel">ביטול</button>');
    function vE() { var v = $("uEmail").value.trim(); return setErr($("uEmail"), $("uEmailMsg"), !v ? "חובה להקליד אימייל." : (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? (USERS.some(function (u) { return u.email === v; }) ? "המשתמש כבר קיים." : "") : "כתובת אימייל לא תקינה.")); }
    function vN() { return setErr($("uName"), $("uNameMsg"), $("uName").value.trim() ? "" : "חובה להקליד שם."); }
    function vR() { return setErr($("uRole"), $("uRoleMsg"), $("uRole").value ? "" : "יש לבחור תפקיד."); }
    $("uEmail").addEventListener("blur", vE); $("uName").addEventListener("blur", vN); $("uRole").addEventListener("change", vR);
    $("uCancel").addEventListener("click", closeDlg);
    $("uSave").addEventListener("click", function () {
      if (![vE(), vN(), vR()].every(Boolean)) return;
      USERS.push({name: $("uName").value.trim(), email: $("uEmail").value.trim(), role: $("uRole").value, last: "עוד לא נכנס"});
      closeDlg(); toast("נשלחה הזמנה במייל."); show("users");
    });
  }

  // ---------- City settings ----------
  V.city = function () {
    return '<div class="p-h"><h2>' + I("city") + 'הגדרות העיר</h2></div><div class="p-b">' +
      '<div class="grid2">' +
        '<div class="f"><label for="hq">טלפון המטה<span class="req">*</span></label><div class="with-ico">' + I("phone") + '<input type="tel" id="hq" inputmode="numeric" dir="ltr" style="text-align:right" value="' + fmtPhone(CITY.hqPhone) + '"></div><div class="msg" id="hqMsg"></div><span class="hint">מוצג לנהגים באפליקציה, בכפתור "התקשר למטה".</span></div>' +
        '<div class="f"><label for="eDate">יום הבחירות<span class="req">*</span></label><input type="date" id="eDate" value="' + CITY.date + '"><div class="msg" id="eDateMsg"></div></div>' +
        '<div class="f"><label for="hFrom">המטה פעיל משעה<span class="req">*</span></label><input type="time" id="hFrom" value="' + CITY.from + '"><div class="msg" id="hFromMsg"></div></div>' +
        '<div class="f"><label for="hTo">עד שעה<span class="req">*</span></label><input type="time" id="hTo" value="' + CITY.to + '"><div class="msg" id="hToMsg"></div></div>' +
      '</div>' +
      '<div class="f"><span>סוג הבחירות<span class="req">*</span></span><div class="seg"><label><input type="radio" name="eType" value="knesset"' + (CITY.type === "knesset" ? " checked" : "") + '>כנסת</label><label><input type="radio" name="eType" value="local"' + (CITY.type === "local" ? " checked" : "") + '>רשויות מקומיות</label></div></div>' +
      '<div><button class="b1" type="button" id="saveCity">' + I("check") + 'שמור הגדרות</button></div></div>';
  };

  // ---------- Routing (hash) ----------
  var current = "dash";
  function show(tab) {
    if (!V[tab]) tab = "dash";
    current = tab;
    document.querySelectorAll("#tabs a").forEach(function (a) { var on = a.getAttribute("data-tab") === tab; a.classList.toggle("on", on); if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    $("view").innerHTML = V[tab]();
    $("topNote").innerHTML = I("calendar") + (CITY.type === "knesset" ? "בחירות לכנסת" : "בחירות לרשויות") + " · " + hebDate(CITY.date);
    if (tab === "dash") wireChart();
    if (tab === "comms" || tab === "streets") lmRender(tab);
  }
  function route() { show((location.hash || "#dash").slice(1)); }
  window.addEventListener("hashchange", route);

  // ---------- Actions (delegated) ----------
  function lmAdd() {
    var m = LM[current], v = $("lmNew").value.trim();
    if (!v) { setErr($("lmNew"), $("lmNewMsg"), "חובה להקליד שם."); return; }
    if (m.items.indexOf(v) >= 0) { setErr($("lmNew"), $("lmNewMsg"), "כבר ברשימה."); return; }
    m.items.push(v); if (current === "streets") MANUAL_STREETS[v] = true; else COMM_NEW[v] = true;
    $("lmNew").value = ""; mark($("lmNew"), null); $("lmNewMsg").textContent = "";
    m.q = ""; $("lmQ").value = ""; lmRender(current); toast('"' + v + '" נוסף לרשימה.'); $("lmNew").focus();
  }
  $("view").addEventListener("click", function (e) {
    var x;
    if ((x = e.target.closest("[data-clf]"))) { V.clusters.filter = x.getAttribute("data-clf"); show("clusters"); return; }
    if ((x = e.target.closest("#addCl"))) { clusterDlg(null); return; }
    if ((x = e.target.closest("[data-edit-cl]"))) { var id = Number(x.getAttribute("data-edit-cl")); clusterDlg(CL.filter(function (c) { return c.id === id; })[0]); return; }
    if ((x = e.target.closest("#lmAdd"))) { lmAdd(); return; }
    if ((x = e.target.closest("[data-lm-edit]"))) { LM[current].editing = x.getAttribute("data-lm-edit"); lmRender(current); return; }
    if ((x = e.target.closest("[data-lm-save]"))) { lmSave(x.getAttribute("data-lm-save")); return; }
    if ((x = e.target.closest("[data-lm-cancel]"))) { LM[current].editing = null; lmRender(current); return; }
    if ((x = e.target.closest("[data-lm-del]"))) { var m = LM[current], s = x.getAttribute("data-lm-del"); m.items.splice(m.items.indexOf(s), 1); delete MANUAL_STREETS[s]; lmRender(current); $("view").querySelector(".p-h .muted").textContent = m.items.length + " ברשימה"; toast('"' + s + '" הוסר מהרשימה.'); return; }
    if ((x = e.target.closest("#reStreets"))) { toast("במערכת: הרשימה נטענת מחדש מ-data.gov.il, ורחובות שנוספו ידנית נשמרים."); return; }
    if ((x = e.target.closest("#loadBase"))) {
      var ok = true;
      document.querySelectorAll("#mapping select").forEach(function (sel) { if (sel.getAttribute("data-req") === "1") ok = setErr(sel, $(sel.id + "Msg"), sel.value ? "" : "יש לבחור עמודה.") && ok; });
      if (!ok) return;
      BASE = {loaded: true, file: $("baseFile").files[0] ? $("baseFile").files[0].name : "voters.csv", rows: 48390, at: "22.11.2026"};
      show("base"); toast("הבייס נטען: 48,390 מצביעים."); return;
    }
    if ((x = e.target.closest("#delBase"))) {
      openDlg("למחוק את בייס המצביעים?", '<p class="lead" style="color:var(--ink)">כל נתוני הבייס יימחקו, כולל הגיבויים. אי אפשר לשחזר. פניות שכבר נקלטו לא יימחקו. אחרי המחיקה יופק אישור מחיקה.</p>',
        '<button class="b1 danger" type="button" id="delYes">' + I("trash") + 'מחק את הבייס</button><button class="b2" type="button" id="delNo">ביטול</button>');
      $("delNo").addEventListener("click", closeDlg);
      $("delYes").addEventListener("click", function () {
        CERTS.unshift({at: "22.11.2026, 11:42", file: BASE.file, rows: BASE.rows, by: "שרה כהן (מנהלת העיר)"});
        BASE = {loaded: false}; closeDlg(); show("base"); toast("הבייס נמחק. אישור המחיקה נשמר ונשלח במייל.");
      });
      return;
    }
    if ((x = e.target.closest("[data-cert]"))) { openDlg("אישור מחיקה", certHtml(CERTS[Number(x.getAttribute("data-cert"))]), '<button class="b2" type="button" id="certClose">סגור</button>'); $("certClose").addEventListener("click", closeDlg); return; }
    if ((x = e.target.closest("#addUser"))) { userDlg(); return; }
    if ((x = e.target.closest("[data-del-user]"))) {
      var ui = Number(x.getAttribute("data-del-user")), u = USERS[ui];
      openDlg("להסיר את " + u.name + "?", '<p class="lead" style="color:var(--ink)">המשתמש לא יוכל להיכנס יותר למערכת.</p>', '<button class="b1 danger" type="button" id="uDelYes">' + I("trash") + 'הסר</button><button class="b2" type="button" id="uDelNo">ביטול</button>');
      $("uDelNo").addEventListener("click", closeDlg);
      $("uDelYes").addEventListener("click", function () { USERS.splice(ui, 1); closeDlg(); show("users"); toast("המשתמש הוסר."); });
      return;
    }
    if ((x = e.target.closest("#saveCity"))) {
      var d = digits($("hq").value);
      var okc = [setErr($("hq"), $("hqMsg"), phoneErr(d)), setErr($("eDate"), $("eDateMsg"), $("eDate").value ? "" : "יש לבחור תאריך."),
        setErr($("hFrom"), $("hFromMsg"), $("hFrom").value ? "" : "חובה."), setErr($("hTo"), $("hToMsg"), !$("hTo").value ? "חובה." : ($("hTo").value <= $("hFrom").value ? "צריך להיות אחרי שעת הפתיחה." : ""))].every(Boolean);
      if (!okc) return;
      CITY.hqPhone = d; CITY.date = $("eDate").value; CITY.from = $("hFrom").value; CITY.to = $("hTo").value; CITY.type = document.querySelector('input[name="eType"]:checked').value;
      show("city"); toast("ההגדרות נשמרו. טלפון המטה מתעדכן אצל הנהגים."); return;
    }
  });
  $("view").addEventListener("input", function (e) {
    if (e.target.id === "lmQ") { LM[current].q = e.target.value; lmRender(current); }
    if (e.target.id === "lmNew" && e.target.value.trim()) { mark(e.target, null); $("lmNewMsg").textContent = ""; }
    if (e.target.id === "hq" && !phoneErr(digits(e.target.value))) setErr(e.target, $("hqMsg"), "");
  });
  $("view").addEventListener("focusout", function (e) { if (e.target.id === "hq") setErr(e.target, $("hqMsg"), phoneErr(digits(e.target.value))); });
  $("view").addEventListener("change", function (e) {
    if (e.target.id === "baseFile") {
      var f = e.target.files[0];
      $("fileName").textContent = f ? f.name : "לא נבחר קובץ"; $("fileName").classList.toggle("has", !!f);
      $("mapping").innerHTML = f ? mappingHtml(f.name) : ""; $("baseFileMsg").textContent = "";
    }
    if (e.target.closest && e.target.closest("#mapping") && e.target.value) setErr(e.target, $(e.target.id + "Msg"), "");
  });
  $("view").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.id === "lmNew") lmAdd();
    if (e.target.id === "lmEditIn") {
      if (e.key === "Enter") { e.preventDefault(); lmSave(LM[current].editing); }
      if (e.key === "Escape") { e.stopPropagation(); LM[current].editing = null; lmRender(current); }
    }
  });

  route();
})();
</script>
