<title>חמישה כיווני עיצוב</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Rubik:wght@400;500;600&family=Assistant:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap">
<style>
html{direction:rtl}
/* מעטפת: לשוניות לכל כיוון, מתחת לכל לשונית מסך משבץ מלא באותם נתונים. מערכת בהירה בלבד (החלטה קיימת), לכן בלי מצב כהה. */
:root{
  --shell-bg:#f3f4f6; --shell-fg:#1d2330; --shell-mute:#5d6676; --shell-line:#dfe3ea; --shell-acc:#0b4c9e;
  --ok:#1f7a3a; --warn:#a15f00; --bad:#c92a2a;
  --ui:"Heebo",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--shell-bg);color:var(--shell-fg);font-family:var(--ui);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;margin:0}
.lead{color:var(--shell-mute);margin:4px 0 0;max-width:70ch;line-height:1.55}
.tabs{display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--shell-bg);padding-block:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--shell-bg)}
.tabs a{display:flex;gap:8px;align-items:center;min-height:40px;padding:0 14px;border:1px solid var(--shell-line);border-radius:10px;background:#fff;color:var(--shell-fg);text-decoration:none;font-weight:500}
.tabs a b{font-weight:700;color:var(--shell-mute)}
.tabs a.on{border-color:var(--shell-acc);box-shadow:inset 0 0 0 1px var(--shell-acc)}
.tabs a:focus-visible{outline:2px solid var(--shell-acc);outline-offset:2px}
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;background:#fff;border:1px solid var(--shell-line);border-radius:12px;padding:16px}
.about h2{margin:0 0 6px;font-size:18px}
.about p{margin:0;color:var(--shell-mute);line-height:1.55}
.about ul{margin:0;padding-inline-start:18px;line-height:1.7}
.about .src{font-size:13px;color:var(--shell-mute);margin-top:8px}
.refs{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;border-top:1px solid var(--shell-line);padding-top:14px}
.refs figure{margin:0;display:grid;gap:6px}
.refs img{width:100%;max-width:100%;border-radius:10px;border:1px solid var(--shell-line);display:block}
.refs figcaption{font-size:13px;color:var(--shell-mute)}
.refs figcaption b{color:var(--shell-fg)}
@media (max-width:760px){.about{grid-template-columns:1fr}}

/* ---- רכיבים משותפים ---- */
.scr{border-radius:14px;overflow:hidden;min-width:0}
.nw{white-space:nowrap}
.wc{width:16px;height:16px;vertical-align:-3px;flex:none}
.map{display:block;width:100%;height:100%}
.flags{display:flex;gap:4px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}

/* ============ A · לוח בהיר (השראה 04) ============ */
.A{--bg:#edf0f5;--card:#fff;--fg:#1b2333;--mute:#6a7385;--line:#e4e8ef;--acc:#1f5fd6;--acc-soft:#e8f0ff;
  font-family:"Heebo",system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:14px;display:flex;flex-direction:column;gap:14px}
.A .top{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:10px 14px;flex-wrap:wrap}
.A .brand{font-weight:700;font-size:16px}
.A .brand span{color:var(--mute);font-weight:400}
.A .search{flex:1;min-width:180px;height:40px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;padding:0 12px;color:var(--mute)}
.A .me{display:flex;gap:8px;align-items:center;color:var(--mute)}
.A .av{width:32px;height:32px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-weight:700}
.A .grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr) minmax(0,300px);gap:14px}
.A .panel{background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.A .ph{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}
.A .ph small{color:var(--mute);font-weight:400;font-size:13px}
.A .pills{display:flex;gap:6px;flex-wrap:wrap}
.A .pill{height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--fg);font-size:13px}
.A .pill.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.A .q{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px;cursor:pointer}
.A .q.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);background:#fbfdff}
.A .q .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.A .q .nm{font-weight:700}
.A .chip{font-size:12px;padding:2px 8px;border-radius:999px;background:#f1f3f7;color:var(--mute)}
.A .wt{font-weight:700;font-size:13px;padding:3px 9px;border-radius:999px;white-space:nowrap}
.A .wt.ok{background:#e7f5ec;color:var(--ok)} .A .wt.warn{background:#fff3df;color:var(--warn)} .A .wt.bad{background:#fde8e8;color:var(--bad)}
.A .route{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px;min-width:0}
.A .route .to{color:var(--fg);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.A .plate{background:var(--fg);color:#fff;border-radius:5px;padding:0 6px;font-weight:700;font-size:12px}
.A .mapbox{position:relative;background:var(--card);border-radius:14px;overflow:hidden;min-height:470px}
.A .mapbox .map{position:absolute;inset:0}
.A .detail{position:absolute;inset:auto 12px 12px 12px;background:#fff;border-radius:12px;box-shadow:0 6px 24px rgba(20,30,60,.14);padding:12px 14px;display:grid;gap:8px}
.A .detail .r1{display:flex;justify-content:space-between;align-items:center}
.A .kv{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}
.A .kv div{display:grid}
.A .kv small{color:var(--mute)}
.A .btn{height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--fg);font-weight:500}
.A .btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.A .drv{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px}
.A .drv .r1{display:flex;justify-content:space-between;align-items:center}
.A .st{font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.A .st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.A .st.free{color:var(--ok)} .A .st.busy{color:var(--acc)} .A .st.brk{color:var(--mute)}
.A .prog{height:6px;border-radius:3px;background:#eef1f6;position:relative;overflow:hidden}
.A .prog i{position:absolute;inset:0 auto 0 0;background:var(--acc);border-radius:3px}
.A .stops{display:grid;gap:0;margin:0;padding:0;list-style:none}
.A .stops li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:13px;padding-bottom:8px;position:relative}
.A .stops li::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--acc);background:#fff;margin-top:3px}
.A .stops li:not(:last-child)::after{content:"";position:absolute;right:5px;top:15px;bottom:0;width:2px;background:#cdd9f2}
.A .stops li.drop::before{background:var(--fg);border-color:var(--fg);border-radius:3px}
.A .m-bg{fill:#eef1f4}.A .m-blk{fill:#e3e7ec}.A .m-st{stroke:#fff}.A .m-park{fill:#dbeedd}.A .m-route{stroke:var(--acc)}.A .m-pick{fill:#fff;stroke:var(--acc)}.A .m-other{fill:#aab3c2}.A .m-clu{fill:var(--fg)}.A .m-clu-t{fill:#fff}.A .m-drv{fill:var(--acc)}.A .m-lbl{fill:#6a7385}

/* ============ B · טבלה שקטה (השראה 24) ============ */
.B{--bg:#f6f6f7;--card:#fff;--fg:#151618;--mute:#6b6e76;--line:#e7e7ea;--acc:#151618;
  font-family:"IBM Plex Sans Hebrew",system-ui,sans-serif;background:var(--bg);color:var(--fg);display:grid;grid-template-columns:190px minmax(0,1fr)}
.B .num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.B aside{background:var(--card);border-inline-end:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.B aside .brand{font-weight:600;font-size:15px;padding:0 8px 12px}
.B aside .brand small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.B aside a{display:flex;align-items:center;height:38px;padding:0 10px;border-radius:8px;color:var(--mute);text-decoration:none}
.B aside a.on{background:#f0f0f2;color:var(--fg);font-weight:600;box-shadow:inset -3px 0 0 var(--fg)}
.B main{padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.B .hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.B .hd h3{margin:0;font-size:20px;font-weight:600}
.B .hd p{margin:2px 0 0;color:var(--mute);font-size:13px}
.B .btn{height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--fg);font-weight:500}
.B .btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.B .box{background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:0}
.B .seg{display:flex;gap:2px;background:#f0f0f2;border-radius:8px;padding:3px;flex-wrap:wrap;width:max-content;max-width:100%}
.B .seg span{height:30px;display:flex;align-items:center;padding:0 10px;border-radius:6px;font-size:13px;color:var(--mute)}
.B .seg span.on{background:#fff;color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.B .tbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;flex-wrap:wrap}
.B .tbar b{font-size:15px}
.B .tw{overflow-x:auto}
.B table{width:100%;border-collapse:collapse;font-size:13px}
.B th{text-align:start;font-weight:500;color:var(--mute);padding:10px 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fafafb;white-space:nowrap}
.B td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.B tr.sel td{background:#f5f6f8}
.B tr.sel td:first-child{box-shadow:inset -3px 0 0 var(--fg)}
.B .wbar{display:flex;align-items:center;gap:8px}
.B .wbar .n{width:26px;font-weight:500}
.B .wbar .tr{width:70px;height:5px;border-radius:3px;background:#eceef1;position:relative}
.B .wbar .tr i{position:absolute;inset:0 0 0 auto;border-radius:3px}
.B .ok i{background:var(--ok)} .B .warn i{background:var(--warn)} .B .bad i{background:var(--bad)}
.B .ok .n{color:var(--ok)} .B .warn .n{color:var(--warn)} .B .bad .n{color:var(--bad)}
.B .tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;white-space:nowrap}
.B .tag.dl{border-color:#f2c4c4;color:var(--bad);background:#fff7f7}
.B .tag.vf{border-color:#efd9b0;color:var(--warn);background:#fffaf0}
.B .plate{border:1.5px solid var(--fg);border-radius:4px;padding:0 5px;font-weight:600;font-size:12px}
.B .low{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,.9fr);gap:14px}
.B .box h4{margin:0;padding:12px 14px;font-size:14px;font-weight:600;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.B .box h4 small{color:var(--mute);font-weight:400}
.B .stops{list-style:none;margin:0;padding:12px 14px;display:grid;gap:10px}
.B .stops li{display:grid;grid-template-columns:52px 1fr;gap:10px;font-size:13px}
.B .stops li .num{color:var(--mute)}
.B .stops li b{font-weight:600}
.B .acts{display:flex;gap:8px;padding:0 14px 14px;flex-wrap:wrap}
.B .mapb{height:260px}
.B .dl2{display:grid}
.B .dl2 div{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;gap:8px}
.B .dl2 div:last-child{border-bottom:0}
.B .dot{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.B .dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.B .dot.free{color:var(--ok)} .B .dot.busy{color:#2b5bd7}
.B .m-bg{fill:#f4f4f5}.B .m-blk{fill:#ebebed}.B .m-st{stroke:#fff}.B .m-park{fill:#e4ece4}.B .m-route{stroke:#151618}.B .m-pick{fill:#fff;stroke:#151618}.B .m-other{fill:#b9bcc3}.B .m-clu{fill:#151618}.B .m-clu-t{fill:#fff}.B .m-drv{fill:#2b5bd7}.B .m-lbl{fill:#6b6e76}

/* ============ C · מפה וגיליון (השראה Wavespace) ============ */
.C{--fg:#121a14;--mute:#5f6b63;--line:#e3e8e4;--acc:#16a34a;--acc-d:#0f7a36;
  font-family:"Rubik",system-ui,sans-serif;color:var(--fg);position:relative;min-height:640px;background:#e9eeea}
.C > .map{position:absolute;inset:0}
.C .float{position:absolute;background:#fff;border-radius:20px;box-shadow:0 8px 30px rgba(15,30,20,.16)}
.C .sbar{top:14px;right:14px;left:14px;height:48px;display:flex;align-items:center;gap:10px;padding:0 8px 0 16px}
.C .sbar .ic{width:34px;height:34px;border-radius:50%;background:#f1f5f2;display:grid;place-items:center;flex:none}
.C .sbar .t{flex:1;color:var(--mute)}
.C .sbar .city{font-weight:500}
.C .queue{top:74px;right:14px;width:320px;bottom:14px;padding:14px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.C .queue h4{margin:0 0 4px;font-size:16px;font-weight:600;display:flex;justify-content:space-between}
.C .queue h4 small{color:var(--mute);font-weight:400}
.C .q{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;padding:8px;border-radius:14px}
.C .q.sel{background:#effaf3;box-shadow:inset 0 0 0 1.5px var(--acc)}
.C .w{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;text-align:center;line-height:1;font-weight:600;font-size:17px}
.C .w small{display:block;font-size:10px;font-weight:400;margin-top:2px}
.C .w.ok{background:#e8f6ed;color:var(--ok)} .C .w.warn{background:#fff2dc;color:var(--warn)} .C .w.bad{background:#fde6e6;color:var(--bad)}
.C .q .nm{font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.C .q .sub{color:var(--mute);font-size:12.5px}
.C .chip{font-size:11px;padding:2px 7px;border-radius:999px;background:#f1f5f2;color:var(--mute);font-weight:400}
.C .chip.dl{background:#fde6e6;color:var(--bad)}
.C .drvs{top:74px;left:14px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 370px);background:transparent;box-shadow:none}
.C .dchip{background:#fff;border-radius:999px;height:36px;padding:0 12px 0 6px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(15,30,20,.12);font-size:13px}
.C .dchip i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:600;color:#fff}
.C .dchip.free i{background:var(--acc)} .C .dchip.busy i{background:#2b6cd7} .C .dchip.brk i{background:#9aa39d}
.C .sheet{left:14px;bottom:14px;width:380px;padding:10px 16px 16px;display:grid;gap:12px}
.C .grab{width:40px;height:4px;border-radius:2px;background:#d9dfdb;margin:0 auto}
.C .sheet .hd{display:flex;justify-content:space-between;align-items:center}
.C .sheet .hd b{font-size:16px}
.C .sheet .hd small{color:var(--mute)}
.C .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.C .stats div{background:#f5f7f6;border-radius:12px;padding:8px;text-align:center}
.C .stats b{display:block;font-size:16px}
.C .stats small{color:var(--mute);font-size:12px}
.C .stops{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13px}
.C .stops li{display:flex;gap:10px;align-items:center}
.C .stops .n{width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.C .stops li.drop .n{background:var(--fg);border-radius:6px}
.C .acts{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.C .btn{height:48px;border-radius:14px;border:0;background:#eef1ef;color:var(--fg);font-weight:500}
.C .btn.pri{background:var(--acc);color:#fff}
.C .tabs2{display:flex;gap:6px;font-size:12px}
.C .tabs2 span{padding:4px 10px;border-radius:999px;background:#f1f5f2;color:var(--mute)}
.C .tabs2 span.on{background:var(--fg);color:#fff}
.C .m-bg{fill:#e9eeea}.C .m-blk{fill:#dfe6e1}.C .m-st{stroke:#fff}.C .m-park{fill:#cfe8d6}.C .m-route{stroke:var(--acc)}.C .m-pick{fill:#fff;stroke:var(--acc)}.C .m-other{fill:#a4ada7}.C .m-clu{fill:var(--fg)}.C .m-clu-t{fill:#fff}.C .m-drv{fill:var(--acc)}.C .m-lbl{fill:#6d786f}

/* ============ D · ציר עצירות (השראה Nova Post + Sundas) ============ */
.D{--fg:#16181d;--mute:#7a7f8a;--line:#ececef;--acc:#0b4c9e;
  font-family:"Assistant",system-ui,sans-serif;background:#fff;color:var(--fg);border:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,.9fr)}
.D .num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.D .col{padding:22px;min-width:0;display:flex;flex-direction:column;gap:14px}
.D .col + .col{border-inline-start:1px solid var(--line)}
.D .lbl{font-size:12px;letter-spacing:.04em;color:var(--mute);font-weight:600}
.D h3{margin:0;font-size:26px;font-weight:700;line-height:1.15}
.D .q{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.D .q:last-child{border-bottom:0}
.D .q .w{font-size:26px;line-height:1;font-weight:500}
.D .q .w small{display:block;font-family:"Assistant",sans-serif;font-size:11px;color:var(--mute);margin-top:4px}
.D .ok{color:var(--ok)} .D .warn{color:var(--warn)} .D .bad{color:var(--bad)}
.D .q .nm{font-weight:700;font-size:15px}
.D .q .sub{color:var(--mute);font-size:13px}
.D .q.sel .nm{color:var(--acc)}
.D .q.sel{position:relative}
.D .q.sel::before{content:"";position:absolute;inset:8px -22px 8px auto;width:3px;background:var(--acc)}
.D .tagline{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.D .t{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.D .t.dl{color:var(--bad);border-color:#f1c6c6}
.D .meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;font-size:14px}
.D .meta small{display:block;color:var(--mute);font-size:12px}
.D .tl{list-style:none;margin:0;padding:0}
.D .tl li{display:grid;grid-template-columns:52px 22px 1fr;gap:10px;min-height:56px}
.D .tl .tm{color:var(--mute);font-size:13px;padding-top:1px}
.D .tl .rail{position:relative;display:flex;justify-content:center}
.D .tl .rail::after{content:"";position:absolute;top:18px;bottom:-2px;width:2px;background:var(--line)}
.D .tl li:last-child .rail::after{display:none}
.D .tl .dt{width:14px;height:14px;border-radius:50%;border:2px solid var(--fg);background:#fff;margin-top:2px;z-index:1}

<script>

const WC='<svg class="wc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="כיסא גלגלים"><circle cx="11" cy="4" r="1.6"/><path d="M11 7v6h5l2.5 5"/><path d="M11 9.5h4"/><path d="M8 11.2a5 5 0 1 0 7.2 6.3"/></svg>';

 {id:209,name:'רחל ופנינה לוי',kind:'נשים',n:2,from:'השומר 15',clu:'בית יעקב',cn:'12',wait:22,vf:true,when:'עכשיו'},
 {id:214,name:'אהרן שפירא',kind:'גבר',n:1,from:"ז'בוטינסקי 101",clu:'ישיבת קול תורה',cn:'',wait:9,when:'עכשיו'},
 {id:216,name:'חיים ומרים קרליבך',kind:'משפחה',n:2,from:'דסלר 4',clu:'ישיבת קול תורה',cn:'',wait:6,when:'13:00'},

 {name:'משה ברגר',ini:'מב',st:'busy',stt:'בנסיעה',info:'לוקח עכשיו: דוד רוזן · מתפנה בעוד 6 דק\'',prog:60},

/* ---------- A ---------- */

  return `<div class="scr E">${mapSVG()}
   <div class="pop" style="left:18%;top:73%"><span class="av">יל</span><span><b>יוסי לוי</b><br>פנוי · 0.8 ק"מ</span></div>

  </div>`;
}
