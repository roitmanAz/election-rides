name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: election_rides_test
          POSTGRES_USER: er
          POSTGRES_PASSWORD: er_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U er -d election_rides_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DB: Host=localhost;Port=5432;Database=election_rides_test;Username=er;Password=er_ci_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build api/ElectionRides.slnx -c Release
      - run: dotnet test api/ElectionRides.slnx -c Release --no-build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx ng test --watch=false
